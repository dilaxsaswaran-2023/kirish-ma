name: kirish

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?stringtype=unspecified
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_WEB_URL}
      BOOTSTRAP_INITIAL_PASSWORD: ${BOOTSTRAP_INITIAL_PASSWORD}
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt:1883
      MQTT_USERNAME: ${MQTT_BACKEND_USERNAME}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      MQTT_CLIENT_ID: kirish-backend
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    ports:
      - "5030:8080"
    networks:
      - private
      - public

  web:
    build:
      context: ./web-app
      args:
        VITE_BASE_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "8030:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private
      - public

  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    environment:
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
    ports:
      - "8884:8883"
    volumes:
      - ./deploy/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mqtt/runtime:/mosquitto/config/runtime:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_BACKEND_USERNAME\" -P \"$$MQTT_BACKEND_PASSWORD\" -t kirish/backend/health -E -W 5"]
      interval: 10s
      timeout: 6s
      retries: 5
    networks:
      - private
      - public

volumes:
  postgres-data:
  mqtt-data:

networks:
  private:
    internal: true
  public:
