spring:
  application:
    name: agrothulir-backend
  datasource:
    url: jdbc:h2:mem:agrothulir;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
agrothulir:
  demo-auth: true
