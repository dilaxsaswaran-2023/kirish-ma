spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agrothulir?stringtype=unspecified}
    username: ${DATABASE_USER:agrothulir_app}
    password: ${DATABASE_PASSWORD}
  h2:
    console:
      enabled: false
server:
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
agrothulir:
  bootstrap-password: ${BOOTSTRAP_INITIAL_PASSWORD}
