services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agrothulir
      POSTGRES_USER: agrothulir_app
      POSTGRES_PASSWORD: local-dev-only
    ports: ["5432:5432"]
    volumes: ["agrothulir-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrothulir_app -d agrothulir"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/agrothulir?stringtype=unspecified
      DATABASE_USER: agrothulir_app
      DATABASE_PASSWORD: local-dev-only
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  agrothulir-postgres:
