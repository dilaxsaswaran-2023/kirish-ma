spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: agrothulir-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agrothulir?stringtype=unspecified}
    username: ${DATABASE_USER:agrothulir_app}
    password: ${DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration_uuid
server:
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
agrothulir:
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap-password: ${BOOTSTRAP_INITIAL_PASSWORD:12345678}
  simulate-devices: false
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:kirish-backend}
    topic-prefix: ${MQTT_TOPIC_PREFIX:kirish}
