per_listener_settings false
allow_anonymous false
retain_available false
password_file /mosquitto/config/runtime/passwords
acl_file /mosquitto/config/runtime/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
message_size_limit 16384
max_inflight_messages 20
max_queued_messages 100

# Docker-only listener: never published on the VM's host interface.
listener 1883
protocol mqtt

# MQTT Explorer / controllers: host port 8884 -> container TLS port 8883.
listener 8883
protocol mqtt
certfile /mosquitto/config/runtime/server.crt
keyfile /mosquitto/config/runtime/server.key
tls_version tlsv1.2
